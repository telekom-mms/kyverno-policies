---

name: Build and release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.22.0
      - run: helm lint ./
      - run: helm template ${{ github.event.repository.name }} ./ > /dev/null

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.22.0
      - run: helm package ./ --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}" --destination dist
      - run: cp dist/${{ github.event.repository.name }}-*.tgz dist/${{ github.event.repository.name }}.tgz
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chart-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.22.0
      - run: |
          mkdir -p site/charts
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
            while IFS= read -r tag; do
              gh release download "$tag" --pattern "${{ github.event.repository.name }}-[0-9]*.tgz" --dir site/charts --clobber
            done
          repo=${GITHUB_REPOSITORY#*/}
          helm repo index site/charts --url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${repo}/charts"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
