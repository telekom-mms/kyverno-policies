policyImageValidation:
  # if namespaced: true, this policy needs to be deployed within the target namespace
  namespaced: false
  # Audit, Warn, Enforce
  validationActions:
    - Audit
  excludedNamespaces: []
  # excludedNamespaces:
  #   - kube-system
  #   - my-legacy-namespace
  excludedLabels: {}
  # excludedLabels:
  #   exclude-from-policy: "true"
  #   allow-root: "yes"
  background: false
  matchImageReferences:
    - glob: '*'
  cosign:
    defaultKeyConfigMap: cosign-public-key
    annotations:
      verify: security.telekom-mms/verify-cosign
      keyConfigMap: security.telekom-mms/cosign-key-configmap
    allowedKeyConfigMaps:
      - cosign-public-key
