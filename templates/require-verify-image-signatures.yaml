{{- if has "require-verify-image-signatures" .Values.includePolicies }}
---
apiVersion: policies.kyverno.io/v1
kind: {{ if .Values.policyImageSignatureVerification.namespaced }}NamespacedImageValidatingPolicy{{ else }}ImageValidatingPolicy{{ end }}
metadata:
  name: require-verify-image-signatures
  annotations:
    policies.kyverno.io/title: Require Image Validation
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.18.0
spec:
  validationActions:
    {{- range (.Values.policyImageSignatureVerification.validationActions) }}
    - {{ . }}
    {{- end }}
  evaluation:
    background:
      enabled: {{ if hasKey .Values.policyImageSignatureVerification "background" }}{{ .Values.policyImageSignatureVerification.background }}{{ else }}true{{ end }}
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    {{- if and (not .Values.policyImageSignatureVerification.namespaced) .Values.policyImageSignatureVerification.excludedNamespaces }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml .Values.policyImageSignatureVerification.excludedNamespaces | nindent 12 }}
    {{- end }}
    {{- if .Values.policyImageSignatureVerification.excludedLabels }}
    objectSelector:
      matchExpressions:
      {{- range $key, $val := .Values.policyImageSignatureVerification.excludedLabels }}
        - key: {{ $key }}
          operator: NotIn
          values:
            - {{ $val | quote }}
      {{- end }}
    {{- end }}

  matchImageReferences:
  {{- range (.Values.policyImageSignatureVerification.matchImageReferences) }}
    - {{ . }}
  {{- end }}

  matchConditions:
    - name: cosign-verification-enabled
      expression: >-
        has(object.metadata.annotations) &&
        {{ .Values.policyImageSignatureVerification.cosign.annotations.verify | quote }}
          in object.metadata.annotations &&
        object.metadata.annotations[
          {{ .Values.policyImageSignatureVerification.cosign.annotations.verify | quote }}
        ] == "true"

  variables:
    - name: signingKeyResourceName
      expression: >-
        has(object.metadata.annotations) &&
        {{ .Values.policyImageValidation.cosign.annotations.keyResource | quote }}
          in object.metadata.annotations &&
        object.metadata.annotations[
          {{ .Values.policyImageValidation.cosign.annotations.keyResource | quote }}
        ] in {{ .Values.policyImageValidation.cosign.allowedKeyResources | toJson }}
        ? object.metadata.annotations[
            {{ .Values.policyImageValidation.cosign.annotations.keyResource | quote }}
          ]
        : {{ .Values.policyImageValidation.cosign.defaultKeyResource | quote }}

    - name: signingKeyResource
      expression: >-
        resource.Get(
          "v1",
          {{ if eq .Values.policyImageValidation.cosign.keyResourceType "Secret" }}"secrets"{{ else }}"configmaps"{{ end }},
          object.metadata.namespace,
          variables.signingKeyResourceName
        )

    - name: signingPublicKey
      expression: >-
        {{- if eq .Values.policyImageValidation.cosign.keyResourceType "Secret" }}
        base64.decode(variables.signingKeyResource.data.pubKey)
        {{- else }}
        variables.signingKeyResource.data.pubKey
        {{- end }}

  attestors:
    - name: cosign
      cosign:
        key:
          expression: variables.signingPublicKey

  validations:
    - expression: >-
        images.containers
          .map(image,
            verifyImageSignatures(image, [attestors.cosign])
          )
          .all(result, result > 0)
      message: >-
        Container image signature verification failed.
        The image must be signed with an approved Cosign public key.
{{- end }}
