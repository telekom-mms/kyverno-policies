{{- if has "require-requests-limits" .Values.includePolicies }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require Limits and Requests
    policies.kyverno.io/category: Best Practices, Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.18.0
    policies.kyverno.io/description: >-
      As application workloads share cluster resources, it is important
      to limit resources requested and consumed by each Pod. It is
      recommended to require resource requests and limits per Pod,
      especially for memory and CPU. If a Namespace level request or
      limit is specified, defaults will automatically be applied to each
      Pod based on the LimitRange configuration. This policy validates
      that all containers have something specified for memory and CPU
      requests and memory limits.
spec:
  validationActions:
    {{- range (.Values.policyRequestsLimits.validationActions) }}
    - {{ . }}
    {{- end }}
  evaluation:
    background:
      enabled: {{ if hasKey .Values.policyRequestsLimits "background" }}{{ .Values.policyRequestsLimits.background }}{{ else }}true{{ end }}
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    {{- if .Values.policyRequestsLimits.excludedNamespaces }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml .Values.policyRequestsLimits.excludedNamespaces | nindent 12 }}
    {{- end }}
    {{- if .Values.policyRequestsLimits.excludedLabels }}
    objectSelector:
      matchExpressions:
      {{- range $key, $val := .Values.policyRequestsLimits.excludedLabels }}
        - key: {{ $key }}
          operator: NotIn
          values:
            - {{ $val | quote }}
      {{- end }}
    {{- end }}
  validations:
    - expression: >
        object.spec.containers.all(container,
          has(container.resources) &&
          has(container.resources.requests) &&
          has(container.resources.requests.cpu) &&
          has(container.resources.requests.memory) &&
          has(container.resources.limits) &&
          has(container.resources.limits.memory)
        )
      message: >-
        CPU and memory resource requests and memory limits are required
        for all containers. CPU limits are optional.

    - expression: >
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(container,
          has(container.resources) &&
          has(container.resources.requests) &&
          has(container.resources.requests.cpu) &&
          has(container.resources.requests.memory) &&
          has(container.resources.limits) &&
          has(container.resources.limits.memory)
        )
      message: >-
        CPU and memory resource requests and memory limits are required
        for all init containers. CPU limits are optional.

    - expression: >
        !has(object.spec.ephemeralContainers) ||
        object.spec.ephemeralContainers.all(container,
          has(container.resources) &&
          has(container.resources.requests) &&
          has(container.resources.requests.cpu) &&
          has(container.resources.requests.memory) &&
          has(container.resources.limits) &&
          has(container.resources.limits.memory)
        )
      message: >-
        CPU and memory resource requests and memory limits are required
        for all ephemeral containers. CPU limits are optional.
{{- end }}
