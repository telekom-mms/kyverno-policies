---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.18.0
    policies.kyverno.io/description: >-
      Using the ':latest' image tag can lead to unpredictable behaviors, 
      inconsistent environments, and makes rollbacks difficult since the 
      underlying image can change without notice. This policy validates 
      that pods do not explicitly use the ':latest' tag in their 
      containers, initContainers, or ephemeralContainers.
spec:
  validationActions:
    {{- range (.Values.policyRequestsLimits.validationActions) }}
    - {{ . }}
    {{- end }}
  evaluation:
    background:
      enabled: {{ if hasKey .Values.policyRequestsLimits "background" }}{{ .Values.policyRequestsLimits.background }}{{ else }}true{{ end }}
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
    {{- if .Values.policyDisallowLatestTag.excludedNamespaces }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            {{- toYaml .Values.policyDisallowLatestTag.excludedNamespaces | nindent 12 }}
    {{- end }}
    {{- if .Values.policyDisallowLatestTag.excludedLabels }}
    objectSelector:
      matchExpressions:
      {{- range $key, $val := .Values.policyDisallowLatestTag.excludedLabels }}
        - key: {{ $key }}
          operator: NotIn
          values:
            - {{ $val | quote }}
      {{- end }}
    {{- end }}
  validations:
    - expression: >-
        !has(object.spec.containers) || 
        object.spec.containers.all(c, !c.image.endsWith(':latest'))
      message: "Containers must not use the ':latest' image tag."
      
    - expression: >-
        !has(object.spec.initContainers) || 
        object.spec.initContainers.all(c, !c.image.endsWith(':latest'))
      message: "Init containers must not use the ':latest' image tag."
      
    - expression: >-
        !has(object.spec.ephemeralContainers) || 
        object.spec.ephemeralContainers.all(c, !c.image.endsWith(':latest'))
      message: "Ephemeral containers must not use the ':latest' image tag."
